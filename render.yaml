# Free demonstration deployment. SQLite state is ephemeral on Render's free tier.
# Public synthetic demo: no access token is needed. Model calls are disabled.
services:
  - type: web
    name: finn-investment-agent-ayush
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt -c backend/requirements.lock
    startCommand: python run.py --host 0.0.0.0
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: FINN_PUBLIC_DEMO
        value: "true"
      - key: FINN_BACKGROUND_LIVE
        value: "false"
      - key: FINN_POLL_SECONDS
        value: "900"
      - key: PYTHONUNBUFFERED
        value: "1"
